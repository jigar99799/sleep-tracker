name: Publish Downloadable Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    if: github.actor == 'jigar99799' && github.triggering_actor == 'jigar99799'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate version tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Use a stable version tag such as v1.0.0.'
            exit 1
          fi
      - name: Require code already on main
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo 'Release rejected: merge the changes into main before tagging this commit.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit
      - run: npm run build
      - run: node scripts/release.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: downloadable-release
          path: |
            release/sleep-habit-log-web.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: github.actor == 'jigar99799' && github.triggering_actor == 'jigar99799'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: downloadable-release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" sleep-habit-log-web.zip SHA256SUMS.txt \
            --verify-tag \
            --title "Sleep & Habit Log $TAG_NAME" \
            --generate-notes \
            --notes 'Download sleep-habit-log-web.zip for the web app and bundled offline assets. This is not an Android APK. To install on Android, open https://jigar99799.github.io/sleep-tracker/ in Chrome and choose Install app. Reminder checks require the app to be open and visible. Read README.md inside the ZIP for setup, privacy, and limitations.'